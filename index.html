<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label Makanan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#F4F5F4;
    --ink:#1B1F22;
    --teal:#212D3A;
    --teal-deep:#0F151C;
    --teal-light:#E4E7EA;
    --signal:#9B2B22;
    --signal-light:#F1E0DD;
    --line:#D3D6D3;
    --gray:#5C6368;
    --brass:#AD8A4E;
    --font-display:'Space Grotesk', Arial, sans-serif;
    --font-mono:'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    overflow-x:hidden;
    font-family:var(--font-display);
    color:var(--ink);
    background:
      repeating-linear-gradient(90deg, rgba(35,81,76,.06) 0, rgba(35,81,76,.06) 1px, transparent 1px, transparent 26px),
      var(--paper);
    min-height:100vh;
  }

  /* ---------- Toolbar (hidden on print) ---------- */
  .toolbar{
    max-width:900px;
    margin:32px auto 0;
    background:#fff;
    border:1.5px solid var(--ink);
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 12px 32px -18px rgba(15,21,28,.45);
  }
  .toolbar-head{
    background:var(--teal);
    padding:18px 24px 16px;
    position:relative;
    border-bottom:2px solid var(--brass);
  }
  .toolbar-head::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:6px;
    background-image:radial-gradient(circle, var(--paper) 2.5px, transparent 2.6px);
    background-size:16px 6px;
    background-position:8px 3px;
    background-repeat:repeat-x;
  }
  .toolbar-head h1{
    font-size:18px; margin:0 0 3px; color:#fff; letter-spacing:.01em;
    font-weight:700;
    display:flex; align-items:center; gap:9px;
  }
  .toolbar-head h1 .dot{
    width:8px; height:8px; border-radius:50%; background:#7FD9A8;
    box-shadow:0 0 0 3px rgba(127,217,168,.3);
    flex-shrink:0;
  }
  .toolbar-head p{
    font-size:12.5px; color:rgba(255,255,255,.75); margin:0; line-height:1.5;
    font-family:var(--font-mono);
  }
  .toolbar-body{ padding:20px 24px 22px; }
  @media (max-width:600px){
    .toolbar{ margin:16px 10px 0; }
    .toolbar-head{ padding:16px 18px 14px; }
    .toolbar-body{ padding:16px 18px 18px; }
    .toolbar-head h1{ font-size:16px; }
    .toolbar-actions{ flex-direction:column; align-items:stretch; }
    .toolbar-actions button{ width:100%; justify-content:center; }
    .live-badge{ justify-content:center; margin-top:2px; }
  }

  .fields{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:12px;
  }
  .fields label{
    display:block; font-size:11.5px; font-weight:600; color:var(--teal);
    margin-bottom:6px;
  }
  .fields input, .fields select{
    width:100%; padding:9px 11px; border:1.5px solid var(--line);
    border-radius:5px; font-size:13.5px; font-family:var(--font-mono); font-weight:600;
    background:#fff; color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .fields input:hover{ border-color:var(--teal); }
  .fields input:focus{
    outline:none; border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(35,81,76,.14);
  }

  .toolbar-actions{ margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

  button{
    font-family:var(--font-display); font-size:13px; font-weight:600; border:1.5px solid var(--ink);
    border-radius:5px; padding:10px 18px; cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  button:active{ transform:translateY(1px); }
  .btn-apply{ background:#2F6B4F; color:#fff; border-color:#1F4E38; }
  .btn-apply:hover{ background:#1F4E38; }
  .btn-print{ background:var(--teal); color:#fff; border-color:var(--teal-deep); }
  .btn-print:hover{ background:var(--teal-deep); }
  .btn-download{ background:linear-gradient(155deg, #C7A25F, var(--brass)); color:var(--teal-deep); border-color:var(--brass); }
  .btn-download:hover{ background:linear-gradient(155deg, #D4B073, #C7A25F); }
  button{ display:inline-flex; align-items:center; gap:7px; }
  button:disabled{ opacity:.6; cursor:wait; transform:none !important; }

  .live-badge{
    font-size:11.5px; font-weight:600; color:var(--teal);
    display:inline-flex; align-items:center; gap:6px;
    font-family:var(--font-mono);
  }
  .live-badge .dot{
    width:6px; height:6px; border-radius:50%; background:var(--teal);
    animation:pulseDot 2.4s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{ box-shadow:0 0 0 0 rgba(35,81,76,.3); }
    50%{ box-shadow:0 0 0 5px rgba(35,81,76,0); }
  }
  @media (prefers-reduced-motion:reduce){
    .live-badge .dot{ animation:none; }
  }
  .hint{ font-size:12px; color:var(--gray); margin-top:14px; font-family:var(--font-mono); }

  /* toast feedback */
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%, 20px);
    background:var(--ink); color:#fff; font-size:13px; font-weight:600;
    font-family:var(--font-mono);
    padding:11px 20px; border-radius:5px; display:flex; align-items:center; gap:8px;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.4);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    z-index:50;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
  .toast svg{ flex-shrink:0; }
  @media print{ .toast{ display:none !important; } }

  /* gentle refresh flash on the sheet when values are applied */
  @keyframes labelFlash{
    0%{ box-shadow:0 0 0 0 rgba(35,81,76,0); }
    30%{ box-shadow:0 0 0 3px rgba(35,81,76,.3); }
    100%{ box-shadow:0 0 0 0 rgba(35,81,76,0); }
  }
  .label.flash{ animation:labelFlash .6s ease; }

  /* ---------- Sheet: A4, 2x5 labels ---------- */
  .sheet-wrap{
    display:flex;
    justify-content:center;
    padding:24px 10px 60px;
    overflow:hidden;
  }
  .sheet-scaler{
    transform-origin:top center;
  }
  .sheet{
    width:210mm;
    height:297mm;
    background:#fff;
    box-shadow:0 1px 6px rgba(0,0,0,.15);
    display:grid;
    grid-template-columns:105mm 105mm;
    grid-template-rows:repeat(8,37.125mm);
  }

  .label{
    position:relative;
    margin:0;
    border:2px solid var(--ink);
    border-top:3px solid var(--brass);
    border-radius:0;
    background:var(--paper);
    padding:1.8mm 2.4mm 1.6mm;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:1mm;
    overflow:hidden;
    font-family:var(--font-display);
    box-shadow:0 1px 2px rgba(21,47,43,.06);
  }
  .label::before{
    /* die-cut punch hole, top-left corner */
    content:"";
    position:absolute;
    top:1.6mm; left:1.6mm;
    width:1.5mm; height:1.5mm;
    border-radius:50%;
    background:var(--paper);
    border:1.4px solid var(--brass);
  }

  .lbl-bar{
    display:flex;
    align-items:center;
    gap:1.4mm;
    padding-left:3.4mm;
  }
  .lbl-bar svg{ flex-shrink:0; }
  .lbl-bar .lbl-brand{
    font-size:11px;
    font-weight:700;
    letter-spacing:.05em;
    color:var(--teal);
    line-height:1.2;
  }

  .lbl-batas{
    display:flex;
    align-items:center;
    gap:2mm;
    background:linear-gradient(155deg, var(--teal) 0%, var(--teal-deep) 100%);
    border-radius:1.3mm;
    border:1.6px solid var(--brass);
    padding:1.8mm 2.4mm;
  }
  .lbl-batas svg{ flex-shrink:0; opacity:.85; }
  .lbl-batas .lbl-text{ display:flex; flex-direction:column; gap:0.4mm; }
  .lbl-batas .lbl-label{
    font-size:10.5px;
    font-weight:700;
    color:#fff;
    letter-spacing:.06em;
  }
  .lbl-batas .lbl-value{
    font-family:var(--font-mono);
    font-size:22px;
    font-weight:700;
    white-space:nowrap;
    color:#fff;
    letter-spacing:.01em;
    line-height:1.15;
  }

  .lbl-warning{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:1.4mm;
    text-align:center;
    font-family:var(--font-display);
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.02em;
    color:#fff;
    background:var(--signal);
    padding:3px 4px;
    margin:0 -2.4mm -1.6mm;
    border-radius:0;
  }
  .lbl-warning svg{ flex-shrink:0; }

  [contenteditable="true"]{ outline:none; border-radius:2px; }
  [contenteditable="true"]:hover{ background:rgba(35,81,76,.1); }
  [contenteditable="true"]:focus{ background:rgba(35,81,76,.18); }

  /* ---------- Print ---------- */
  @media print{
    body{ background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    .toolbar{ display:none; }
    .sheet-wrap{ padding:0; overflow:visible; }
    .sheet-scaler{ transform:none !important; }
    .sheet{ box-shadow:none; margin:0; width:210mm; height:297mm; }
    [contenteditable="true"]:hover, [contenteditable="true"]:focus{ background:transparent; }
    @page{ size:A4; margin:0; }
  }
</style>
</head>
<body>

  <div class="toolbar" id="toolbar">
    <div class="toolbar-head">
      <h1><span class="dot"></span>SAN &middot; Label Makanan</h1>
      <p>Cetak label batas konsumsi untuk katering/dapur</p>
    </div>

    <div class="toolbar-body">
    <div class="fields">
      <div><label>Batas konsumsi (jam)</label><input id="f-jam" value="12.00"></div>
      <div><label>Tanggal</label><input id="f-tanggal" type="date"></div>
    </div>

    <div class="toolbar-actions">
      <button class="btn-apply" onclick="applyAll(true)">✓ Terapkan ke Semua Label</button>
      <button class="btn-print" id="btnPrintDirect" onclick="printDirect()">🖶 Cetak Langsung</button>
      <button class="btn-download" id="btnDownload" onclick="downloadPDF()">⬇ Download PDF</button>
      <span class="live-badge"><span class="dot"></span>Pembaruan otomatis aktif</span>
    </div>
    <div class="hint">A4 &middot; 2×8 label per lembar &middot; 16 label</div>
    </div>
  </div>

  <div class="sheet-wrap">
    <div class="sheet-scaler" id="sheetScaler">
      <div class="sheet" id="sheet"></div>
    </div>
  </div>

  <div class="toast" id="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#7FD9A8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="toastMsg">Diterapkan ke 16 label</span>
  </div>

<script>
  const LABEL_TEMPLATE = () => `
    <div class="lbl-bar">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 2l7 3v6c0 5-3.2 8.7-7 10-3.8-1.3-7-5-7-10V5l7-3z" fill="var(--teal)"/><path d="M8.5 12l2.3 2.3L16 9.3" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <div class="lbl-brand">Label Makanan</div>
    </div>

    <div class="lbl-batas">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="1.8"/><path d="M12 7v5l3.5 2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="lbl-text">
        <div class="lbl-label">Batas konsumsi</div>
        <div class="lbl-value"><span class="d-jam" contenteditable="true">12.00</span> WIB &middot; <span class="d-tanggal" contenteditable="true">26 Agustus 2026</span></div>
      </div>
    </div>

    <div class="lbl-warning">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 3l10 18H2L12 3z" fill="#fff"/><rect x="11" y="9" width="2" height="6" fill="var(--signal)"/><rect x="11" y="16.5" width="2" height="2" fill="var(--signal)"/></svg>
      <span contenteditable="true">Dilarang dibawa pulang</span>
    </div>
  `;

  const sheet = document.getElementById('sheet');
  for(let i=0;i<16;i++){
    const div = document.createElement('div');
    div.className = 'label';
    div.innerHTML = LABEL_TEMPLATE();
    sheet.appendChild(div);
  }

  let toastTimer = null;
  function showToast(msg, duration){
    const toast = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), duration || 1600);
  }

  async function generateSheetPDF(){
    const scaler = document.getElementById('sheetScaler');
    const prevTransform = scaler.style.transform;
    scaler.style.transform = 'none';
    await new Promise(r=>setTimeout(r,80));

    const sheetEl = document.getElementById('sheet');
    const canvas = await html2canvas(sheetEl, { scale:3, useCORS:true, backgroundColor:'#ffffff' });

    scaler.style.transform = prevTransform;
    fitSheetToScreen();

    const imgData = canvas.toDataURL('image/jpeg', 0.98);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
    pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
    return pdf;
  }

  async function runWithButtonState(btnId, busyLabel, toastBusy, fn){
    const btn = document.getElementById(btnId);
    const originalLabel = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = busyLabel;
    showToast(toastBusy, 60000);
    try{
      await fn();
    }catch(err){
      console.error(err);
      showToast('Gagal membuat PDF, coba lagi');
    }finally{
      btn.disabled = false;
      btn.innerHTML = originalLabel;
    }
  }

  function downloadPDF(){
    runWithButtonState('btnDownload', '⏳ Menyiapkan...', 'Menyiapkan PDF, mohon tunggu…', async ()=>{
      const pdf = await generateSheetPDF();
      pdf.save('label-makanan.pdf');
      showToast('✓ PDF berhasil diunduh');
    });
  }

  function printDirect(){
    runWithButtonState('btnPrintDirect', '⏳ Menyiapkan...', 'Menyiapkan halaman cetak…', async ()=>{
      const pdf = await generateSheetPDF();
      pdf.autoPrint();
      const blobUrl = pdf.output('bloburl');
      window.open(blobUrl, '_blank');
      showToast('✓ Siap dicetak — pilih printer di tab baru');
    });
  }

  const BULAN_ID = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  function formatTanggalID(isoValue){
    if(!isoValue) return '';
    const [y,m,d] = isoValue.split('-').map(Number);
    if(!y || !m || !d) return '';
    return `${d} ${BULAN_ID[m-1]} ${y}`;
  }

  function applyAll(announce){
    const jam = document.getElementById('f-jam').value;
    const tanggal = formatTanggalID(document.getElementById('f-tanggal').value);

    const labels = document.querySelectorAll('.label');
    labels.forEach(label=>{
      label.querySelector('.d-jam').textContent = jam;
      label.querySelector('.d-tanggal').textContent = tanggal;
      if(announce){
        label.classList.remove('flash');
        void label.offsetWidth; // restart animation
        label.classList.add('flash');
      }
    });

    if(announce){
      showToast('Diterapkan ke ' + labels.length + ' label');
    }
  }

  // Live update: re-apply automatically as the user types (debounced)
  let liveTimer = null;
  function scheduleAutoApply(){
    clearTimeout(liveTimer);
    liveTimer = setTimeout(()=> applyAll(false), 250);
  }
  document.querySelectorAll('.toolbar input').forEach(input=>{
    input.addEventListener('input', scheduleAutoApply);
  });

  // Set the date field to today's date automatically on load
  (function setTodayDate(){
    const today = new Date();
    const iso = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
    document.getElementById('f-tanggal').value = iso;
  })();

  applyAll(false);
  fitSheetToScreen();
  window.addEventListener('resize', fitSheetToScreen);

  function fitSheetToScreen(){
    const wrap = document.querySelector('.sheet-wrap');
    const scaler = document.getElementById('sheetScaler');
    const sheet = document.getElementById('sheet');
    const availableWidth = wrap.clientWidth - 20;
    const sheetWidth = sheet.offsetWidth;
    const sheetHeight = sheet.offsetHeight;
    const scale = Math.min(1, availableWidth / sheetWidth);
    scaler.style.transform = 'scale(' + scale + ')';
    wrap.style.height = (sheetHeight * scale + 40) + 'px';
  }
</script>

</body>
</html>
